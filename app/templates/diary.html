{% extends "base.html" %}

{% block title %}记录日记 - Are You OK{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-pen-fancy"></i>
                    {% if diary %}编辑{% else %}新建{% endif %}日记 - {{ today.strftime('%Y年%m月%d日') }}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">标题 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ diary.title if diary else '' }}" 
                               placeholder="输入日记标题" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="mood" class="form-label">今天的心情 <span class="text-danger">*</span></label>
                        <div class="mood-selector">
                            {% for i in range(1, 6) %}
                            <input type="radio" id="mood{{ i }}" name="mood" value="{{ i }}" 
                                   {% if diary and diary.mood == i %}checked{% elif not diary and i == 3 %}checked{% endif %}>
                            <label for="mood{{ i }}" class="mood-option" title="{% if i == 1 %}很糟糕{% elif i == 2 %}不太好{% elif i == 3 %}一般{% elif i == 4 %}不错{% elif i == 5 %}很棒{% endif %}">
                                {% if i == 1 %}😢{% elif i == 2 %}😕{% elif i == 3 %}😐{% elif i == 4 %}😊{% elif i == 5 %}😄{% endif %}
                            </label>
                            {% endfor %}
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="content" class="form-label">日记内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="10" 
                                  placeholder="写下你今天的想法、感受和经历..." required>{{ diary.content if diary else '' }}</textarea>
                        <small class="form-text text-muted">{{ diary.content|length if diary else '0' }} / 5000 字符</small>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存日记
                        </button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.mood-selector {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 10px;
}

.mood-selector input {
    display: none;
}

.mood-option {
    font-size: 2.5em;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
}

.mood-selector input:checked + .mood-option {
    opacity: 1;
    transform: scale(1.1);
}

.mood-option:hover {
    opacity: 0.8;
    transform: scale(1.05);
}
</style>

<script>
// 字符计数
document.getElementById('content').addEventListener('input', function() {
    const count = this.value.length;
    document.querySelector('.form-text').textContent = count + ' / 5000 字符';
});
</script>
{% endblock %}
